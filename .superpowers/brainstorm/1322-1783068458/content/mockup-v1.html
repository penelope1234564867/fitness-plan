<div style="max-width:1000px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">

  <h2 style="margin:0 0 4px;font-size:20px;font-weight:700;">⚙️ 个人设置</h2>
  <p style="margin:0 0 20px;color:#888;font-size:13px;">管理你的个人资料、训练偏好与当前周期</p>

  <!-- 三列布局 -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">

    <!-- ── 左列：编辑个人信息 ── -->
    <div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.07);border:1px solid #f0f0f0;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;">
        <span style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#f97316,#fb923c);display:flex;align-items:center;justify-content:center;font-size:16px;">✏️</span>
        <span style="font-size:15px;font-weight:700;color:#1a1a1a;">编辑个人信息</span>
      </div>

      <!-- 身高 -->
      <div style="margin-bottom:14px;">
        <label style="display:block;font-size:12px;color:#888;margin-bottom:4px;font-weight:500;">身高</label>
        <div style="display:flex;align-items:center;background:#f8f8f8;border-radius:10px;padding:0 14px;border:1.5px solid #eee;transition:border-color 0.2s;">
          <input type="number" value="180" style="flex:1;border:none;background:transparent;padding:11px 0;font-size:14px;font-weight:600;color:#1a1a1a;outline:none;font-family:inherit;" readonly>
          <span style="font-size:13px;color:#999;font-weight:500;">cm</span>
        </div>
      </div>

      <!-- 体重 -->
      <div style="margin-bottom:14px;">
        <label style="display:block;font-size:12px;color:#888;margin-bottom:4px;font-weight:500;">体重</label>
        <div style="display:flex;align-items:center;background:#f8f8f8;border-radius:10px;padding:0 14px;border:1.5px solid #eee;">
          <input type="number" value="72" style="flex:1;border:none;background:transparent;padding:11px 0;font-size:14px;font-weight:600;color:#1a1a1a;outline:none;font-family:inherit;" readonly>
          <span style="font-size:13px;color:#999;font-weight:500;">kg</span>
        </div>
      </div>

      <!-- 年龄 -->
      <div style="margin-bottom:14px;">
        <label style="display:block;font-size:12px;color:#888;margin-bottom:4px;font-weight:500;">年龄</label>
        <div style="display:flex;align-items:center;background:#f8f8f8;border-radius:10px;padding:0 14px;border:1.5px solid #eee;">
          <input type="number" value="28" style="flex:1;border:none;background:transparent;padding:11px 0;font-size:14px;font-weight:600;color:#1a1a1a;outline:none;font-family:inherit;" readonly>
          <span style="font-size:13px;color:#999;font-weight:500;">岁</span>
        </div>
      </div>

      <!-- 性别 -->
      <div style="margin-bottom:6px;">
        <label style="display:block;font-size:12px;color:#888;margin-bottom:6px;font-weight:500;">性别</label>
        <div style="display:flex;gap:8px;">
          <div style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#fff7ed;border:1.5px solid #f97316;color:#f97316;font-weight:700;font-size:14px;cursor:pointer;">♂ 男</div>
          <div style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#f8f8f8;border:1.5px solid #eee;color:#999;font-size:14px;cursor:pointer;">♀ 女</div>
        </div>
      </div>

      <!-- 保存按钮 -->
      <button style="width:100%;margin-top:16px;padding:11px;border:none;border-radius:10px;background:linear-gradient(135deg,#f97316,#fb923c);color:#fff;font-size:14px;font-weight:700;cursor:pointer;">💾 保存修改</button>
    </div>

    <!-- ── 中列：当前训练状态 ── -->
    <div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.07);border:1px solid #f0f0f0;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;">
        <span style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:16px;">⚙️</span>
        <span style="font-size:15px;font-weight:700;color:#1a1a1a;">当前训练状态</span>
      </div>

      <!-- 经验等级 -->
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:12px;color:#888;margin-bottom:6px;font-weight:500;">经验等级</label>
        <div style="display:flex;gap:6px;">
          <div style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#fff7ed;border:1.5px solid #f97316;color:#f97316;font-weight:700;font-size:13px;">🌱 新手</div>
          <div style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#f8f8f8;border:1.5px solid #eee;color:#999;font-size:13px;">💪 中级</div>
          <div style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#f8f8f8;border:1.5px solid #eee;color:#999;font-size:13px;">🔥 高级</div>
        </div>
      </div>

      <!-- 训练地点 -->
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:12px;color:#888;margin-bottom:6px;font-weight:500;">训练地点</label>
        <div style="display:flex;gap:6px;">
          <div style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#f0fdf4;border:1.5px solid #22c55e;color:#22c55e;font-weight:700;font-size:13px;">🏠 居家</div>
          <div style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#f8f8f8;border:1.5px solid #eee;color:#999;font-size:13px;">🏋️ 健身房</div>
          <div style="flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#f8f8f8;border:1.5px solid #eee;color:#999;font-size:13px;">🌳 户外</div>
        </div>
      </div>

      <!-- 训练日 -->
      <div style="margin-bottom:6px;">
        <label style="display:block;font-size:12px;color:#888;margin-bottom:8px;font-weight:500;">训练日</label>
        <div style="display:flex;gap:5px;justify-content:space-between;">
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:#f97316;color:#fff;cursor:pointer;">一</div>
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:1.5px solid #eee;color:#999;cursor:pointer;">二</div>
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:#f97316;color:#fff;cursor:pointer;">三</div>
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:1.5px solid #eee;color:#999;cursor:pointer;">四</div>
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:#f97316;color:#fff;cursor:pointer;">五</div>
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:1.5px solid #eee;color:#999;cursor:pointer;">六</div>
          <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:1.5px solid #eee;color:#999;cursor:pointer;">日</div>
        </div>
        <p style="font-size:12px;color:#888;margin:8px 0 0;">每周 3 天</p>
      </div>

      <!-- 保存按钮 -->
      <button style="width:100%;margin-top:12px;padding:11px;border:none;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#60a5fa);color:#fff;font-size:14px;font-weight:700;cursor:pointer;">💾 保存训练状态</button>
    </div>

    <!-- ── 右列：基础适应期 ── -->
    <div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.07);border:1px solid #f0f0f0;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <span style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#22c55e,#4ade80);display:flex;align-items:center;justify-content:center;font-size:16px;">🌱</span>
        <span style="font-size:15px;font-weight:700;color:#1a1a1a;">基础适应期</span>
      </div>

      <!-- 进度环简化版 -->
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:14px;background:#f9fafb;border-radius:12px;">
        <div style="width:60px;height:60px;border-radius:50%;background:conic-gradient(#22c55e 0deg 180deg, #e8e8e8 180deg 360deg);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <div style="width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#22c55e;">3/8</div>
        </div>
        <div>
          <div style="font-size:14px;font-weight:700;color:#1a1a1a;">第 3 周 / 共 8 周</div>
          <div style="font-size:12px;color:#888;margin-top:2px;">剩余 5 周 → 肌肥大期</div>
        </div>
      </div>

      <!-- 阶段说明 -->
      <div style="background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-radius:12px;padding:14px;border:1px solid #bbf7d0;flex:1;">
        <div style="font-size:13px;font-weight:700;color:#16a34a;margin-bottom:8px;">🤔 这个阶段练什么？</div>
        <p style="font-size:12px;color:#555;line-height:1.8;margin:0;">
          用比较轻的重量先把动作学标准，重点练深蹲、卧推这些基础动作。
          这个阶段不用着急上大重量，先把姿势练对，以后的训练才能不受伤、效果更好。
        </p>
      </div>

      <!-- 下一阶段预告 -->
      <div style="margin-top:12px;padding:10px 14px;background:#f8f8f8;border-radius:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:12px;color:#888;">⏭️ 下一阶段</span>
        <span style="font-size:13px;font-weight:700;color:#22c55e;">🔥 肌肥大期</span>
      </div>
    </div>

  </div>
</div>
