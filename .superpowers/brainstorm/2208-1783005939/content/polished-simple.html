<h2>✨ 大白话版本</h2>
<p class="subtitle">不堆术语，人人都能看懂</p>

<style>
.demo-card {
  max-width: 420px;
  margin: 0 auto;
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  border: 1px solid #f0f0f0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.demo-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.demo-phase { display: flex; align-items: center; gap: 6px; }
.demo-icon { font-size: 22px; }
.demo-name { font-size: 16px; font-weight: 800; color: #1a1a1a; }
.demo-week { font-size: 12px; color: #888; font-weight: 400; }
.demo-countdown { text-align: right; }
.demo-countdown-label { font-size: 11px; color: #888; }
.demo-countdown-num { font-size: 20px; font-weight: 800; color: #f97316; }

.demo-bar-wrap { margin-bottom: 16px; }
.demo-bar-header { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 4px; }
.demo-bar { height: 10px; background: #f0f0f0; border-radius: 5px; overflow: hidden; display: flex; }
.demo-bar-fill { height: 100%; }
.demo-bar-empty { flex: 1; height: 100%; background: #e8e8e8; }

.demo-phases {
  display: flex;
  gap: 0;
  margin-bottom: 16px;
  background: #fafafa;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #eee;
}
.demo-phase-btn {
  flex: 1;
  text-align: center;
  padding: 10px 2px;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background: transparent;
  font-family: inherit;
  border-right: 1px solid #eee;
}
.demo-phase-btn:last-child { border-right: none; }
.demo-phase-btn:hover { background: #fff7ed; }
.demo-pb-icon { font-size: 12px; font-weight: 600; display: block; }
.demo-pb-weeks { font-size: 9px; color: #888; display: block; margin: 1px 0; }
.demo-pb-status { font-size: 10px; display: block; }
.demo-pb-status.current { color: #f97316; font-weight: 500; }
.demo-pb-status.done { color: #22c55e; font-weight: 500; }
.demo-pb-status.pending { color: #bbb; }
.demo-phase-btn.active-tab { background: #fff7ed; box-shadow: inset 0 -2px 0 #f97316; }

.demo-cards { display: flex; gap: 8px; margin-bottom: 12px; }
.demo-sub-card { flex: 1; background: #f9f9f9; border-radius: 10px; padding: 10px; }
.demo-sub-label { font-size: 10px; color: #888; margin-bottom: 4px; }
.demo-sub-value { font-size: 16px; font-weight: 800; color: #1a1a1a; }
.demo-sub-hint { font-size: 10px; color: #f97316; margin-top: 2px; }

.demo-desc {
  background: linear-gradient(135deg, #fef7e6 0%, #fff5f5 100%);
  border-radius: 10px;
  padding: 12px 14px;
  border: 1px solid #ffe8cc;
  min-height: 72px;
  transition: all 0.3s ease;
}
.demo-desc-title { font-size: 13px; font-weight: 600; color: #d97706; margin-bottom: 6px; }
.demo-desc-text { font-size: 12px; color: #555; line-height: 1.7; border-top: 1px solid #ffe8cc; padding-top: 6px; }
</style>

<div class="demo-card">

  <div class="demo-top">
    <div class="demo-phase">
      <span class="demo-icon">🔥</span>
      <span class="demo-name">燃脂强化期</span>
      <span class="demo-week">第 5/16 周</span>
    </div>
    <div class="demo-countdown">
      <div class="demo-countdown-label">⏳ 剩余</div>
      <div class="demo-countdown-num">3 周</div>
    </div>
  </div>

  <div class="demo-bar-wrap">
    <div class="demo-bar-header">
      <span>📊 大周期进度</span>
      <span>5/16</span>
    </div>
    <div class="demo-bar">
      <div class="demo-bar-fill" style="width:25%;border-radius:5px 0 0 5px;background:linear-gradient(90deg,#3b82f6,#22c55e);"></div>
      <div style="width:6%;height:100%;background:#f97316;"></div>
      <div class="demo-bar-empty"></div>
    </div>
  </div>

  <div class="demo-phases">
    <button id="pf" class="demo-phase-btn" onclick="pickPhase('foundational')">
      <span class="demo-pb-icon">🌱 基础适应</span>
      <span class="demo-pb-weeks">4 周</span>
      <span class="demo-pb-status done">✅ 已完成</span>
    </button>
    <button id="ph" class="demo-phase-btn active-tab" onclick="pickPhase('hypertrophy')">
      <span class="demo-pb-icon" style="color:#1a1a1a;">🔥 燃脂强化</span>
      <span class="demo-pb-weeks">4 周</span>
      <span class="demo-pb-status current">◉ 第3/4周</span>
    </button>
    <button id="pm" class="demo-phase-btn" onclick="pickPhase('metabolic')">
      <span class="demo-pb-icon" style="color:#999;">⚡ 代谢提升</span>
      <span class="demo-pb-weeks">4 周</span>
      <span class="demo-pb-status pending">即将到来</span>
    </button>
    <button id="pd" class="demo-phase-btn" onclick="pickPhase('deload')">
      <span class="demo-pb-icon" style="color:#999;">🔄 减载恢复</span>
      <span class="demo-pb-weeks">1 周</span>
      <span class="demo-pb-status pending">即将到来</span>
    </button>
  </div>

  <div class="demo-cards">
    <div class="demo-sub-card">
      <div class="demo-sub-label">✅ 本周训练</div>
      <div class="demo-sub-value">2/3</div>
      <div class="demo-sub-hint">还剩 1 天</div>
    </div>
    <div class="demo-sub-card">
      <div class="demo-sub-label">🧭 下一阶段</div>
      <div class="demo-sub-value" style="font-size:14px;">⚡ 代谢提升期</div>
      <div class="demo-sub-hint" style="color:#888;">约 2 周后</div>
    </div>
  </div>

  <div id="descBox" class="demo-desc">
    <div id="dt" class="demo-desc-title">🤔 这个阶段练什么？</div>
    <div id="dc2" class="demo-desc-text">用中等偏重的重量，每组做 8-12 下，配合有氧运动。这样可以一边消耗热量一边给肌肉足够的刺激，不会因为少吃而掉肌肉。这个阶段最关键的是多吃蛋白质（肉蛋奶），才能保住练出来的肌肉。</div>
  </div>

</div>

<div style="margin-top:12px;text-align:center;font-size:11px;color:#888;">
  👆 点击各阶段查看大白话说明
</div>

<script>
const DESCRIPTIONS = {
  foundational: {
    title: '🤔 这个阶段练什么？',
    text: '主要目的是学会动作怎么做标准，用比较轻的重量练。不用着急上大重量，先把深蹲、卧推这些基础动作的姿势练对。这个阶段身体在适应运动，即使吃得不多，也能同时长肌肉和减脂肪。'
  },
  hypertrophy: {
    title: '🤔 这个阶段练什么？',
    text: '用中等偏重的重量，每组做 8-12 下，配合有氧运动。这样可以一边消耗热量一边给肌肉足够的刺激，不会因为少吃而掉肌肉。这个阶段最关键的是多吃蛋白质（肉蛋奶），才能保住练出来的肌肉。'
  },
  metabolic: {
    title: '🤔 这个阶段练什么？',
    text: '每周不同天数练不同次数——有几天练重一点（6-8下），有几天练轻一点（15-20下）。同时增加高强度间歇运动。目的是突破减脂瓶颈，避免身体适应后不再掉秤。如果感觉太累了，可以安排一两天正常吃饭补充能量。'
  },
  deload: {
    title: '🤔 这个阶段练什么？',
    text: '运动量减半，重量也减轻，让身体彻底放松恢复。连续减脂好几个月，身体和神经都很疲劳。这一周就是让身体"充充电"，休息好了下一轮才能练得更带劲。研究说每4-8周安排一次减载周，后续力量能提升 32%。'
  }
}

function pickPhase(phase) {
  document.getElementById('dt').textContent = DESCRIPTIONS[phase].title
  document.getElementById('dc2').textContent = DESCRIPTIONS[phase].text

  document.querySelectorAll('.demo-phase-btn').forEach(b => b.classList.remove('active-tab'))
  if (phase === 'foundational') document.getElementById('pf').classList.add('active-tab')
  else if (phase === 'hypertrophy') document.getElementById('ph').classList.add('active-tab')
  else if (phase === 'metabolic') document.getElementById('pm').classList.add('active-tab')
  else if (phase === 'deload') document.getElementById('pd').classList.add('active-tab')
}
</script>
