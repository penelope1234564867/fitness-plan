<script>
const DESCRIPTIONS = {
  foundational: {
    title: '📖 基础适应期：建立训练基础',
    text: '以学习动作模式为主，使用轻-中等重量（60-70% 1RM）。神经系统适应优先于肌肉增长，正确的动作模式是后续所有阶段的基础。新手在此阶段可出现「新手红利」——在热量赤字下同时增肌减脂。'
  },
  hypertrophy: {
    title: '📖 燃脂强化期：最大化能量消耗',
    text: '中高容量训练（8-12次，3-4组），配合 HIIT 和中等热量赤字（15-20%）。保持足够机械张力信号以防止肌肉流失，蛋白质摄入 1.6-2.4g/kg/天是减脂期保留肌肉的关键。'
  },
  metabolic: {
    title: '📖 代谢提升期：突破平台期',
    text: '混合次数范围训练（6-8次 + 15-20次交替），HIIT 频率增加。当身体适应赤字后代谢率可能下降，通过训练变化和 refeed 策略（碳水拉到维持水平）来突破平台期，维持减脂势头。'
  },
  deload: {
    title: '📖 减载恢复周：主动恢复',
    text: '容量减少 50-60%，强度降至 50-60% 1RM。持续减脂给中枢神经系统带来巨大疲劳，减载周让神经系统和关节完全恢复。研究显示每 4-8 周安排减载可提升后续力量表现 32%。'
  }
}

function pickPhase(phase) {
  // 只切换说明区
  document.getElementById('dt').textContent = DESCRIPTIONS[phase].title
  document.getElementById('dc2').textContent = DESCRIPTIONS[phase].text

  // 切换按钮高亮样式（tab 效果而已）
  document.querySelectorAll('.demo-phase-btn').forEach(b => b.classList.remove('active-tab'))
  document.getElementById('pf').classList.remove('active-tab')
  document.getElementById('ph').classList.remove('active-tab')
  document.getElementById('pm').classList.remove('active-tab')
  document.getElementById('pd').classList.remove('active-tab')

  if (phase === 'foundational') document.getElementById('pf').classList.add('active-tab')
  else if (phase === 'hypertrophy') document.getElementById('ph').classList.add('active-tab')
  else if (phase === 'metabolic') document.getElementById('pm').classList.add('active-tab')
  else if (phase === 'deload') document.getElementById('pd').classList.add('active-tab')
}
</script>
