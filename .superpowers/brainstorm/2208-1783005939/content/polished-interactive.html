<h2>✨ 精致版 · 点击切换</h2>
<p class="subtitle">点击下方阶段卡片，说明实时切换</p>

<style>
.demo-card {
  max-width: 420px;
  margin: 0 auto;
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  border: 1px solid #f0f0f0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.demo-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.demo-phase {
  display: flex;
  align-items: center;
  gap: 6px;
}
.demo-icon { font-size: 22px; }
.demo-name { font-size: 16px; font-weight: 800; color: #1a1a1a; }
.demo-week { font-size: 12px; color: #888; font-weight: 400; }
.demo-countdown { text-align: right; }
.demo-countdown-label { font-size: 11px; color: #888; }
.demo-countdown-num { font-size: 20px; font-weight: 800; color: #f97316; }

.demo-bar-wrap { margin-bottom: 16px; }
.demo-bar-header { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 4px; }
.demo-bar { height: 10px; background: #f0f0f0; border-radius: 5px; overflow: hidden; display: flex; }
.demo-bar-fill { height: 100%; border-radius: 5px 0 0 5px; }
.demo-bar-empty { flex: 1; height: 100%; background: #e8e8e8; border-radius: 0 5px 5px 0; }

.demo-phases {
  display: flex;
  gap: 0;
  margin-bottom: 16px;
  background: #fafafa;
  border-radius: 10px;
  overflow: hidden;
}
.demo-phase-btn {
  flex: 1;
  text-align: center;
  padding: 10px 2px;
  cursor: pointer;
  transition: all 0.25s;
  border: none;
  background: transparent;
  font-family: inherit;
  position: relative;
}
.demo-phase-btn:hover {
  background: #fff7ed;
}
.demo-phase-btn.active {
  background: #fff7ed;
  box-shadow: inset 0 -3px 0 #f97316;
}
.demo-phase-btn.active .demo-pb-icon { font-weight: 700; }
.demo-pb-icon { font-size: 13px; font-weight: 600; color: #333; display: block; margin-bottom: 2px; }
.demo-pb-status { font-size: 10px; }
.demo-pb-status.active-s { color: #f97316; font-weight: 500; }
.demo-pb-status.done { color: #22c55e; font-weight: 500; }
.demo-pb-status.waiting { color: #bbb; }

.demo-cards {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.demo-sub-card {
  flex: 1;
  background: #f9f9f9;
  border-radius: 10px;
  padding: 10px;
}
.demo-sub-label { font-size: 10px; color: #888; margin-bottom: 4px; }
.demo-sub-value { font-size: 16px; font-weight: 800; color: #1a1a1a; }
.demo-sub-hint { font-size: 10px; color: #f97316; margin-top: 2px; }

.demo-desc {
  background: linear-gradient(135deg, #f0f5ff 0%, #faf5ff 100%);
  border-radius: 10px;
  padding: 12px 14px;
  border: 1px solid #e8eeff;
  min-height: 72px;
  transition: all 0.3s ease;
}
.demo-desc-title {
  font-size: 13px;
  font-weight: 600;
  color: #4a6cf7;
  margin-bottom: 6px;
}
.demo-desc-text {
  font-size: 12px;
  color: #555;
  line-height: 1.7;
  border-top: 1px solid #e0e8ff;
  padding-top: 6px;
}

.legend {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 14px;
  font-size: 11px;
  color: #888;
}
</style>

<div class="demo-card">

  <div class="demo-top">
    <div class="demo-phase">
      <span id="di" class="demo-icon">🌱</span>
      <span id="dn" class="demo-name">基础适应期</span>
      <span class="demo-week">第 1/16 周</span>
    </div>
    <div class="demo-countdown">
      <div class="demo-countdown-label">⏳ 剩余</div>
      <div id="dc" class="demo-countdown-num">4 周</div>
    </div>
  </div>

  <div class="demo-bar-wrap">
    <div class="demo-bar-header">
      <span>📊 大周期进度</span>
      <span id="dwp">1/16</span>
    </div>
    <div class="demo-bar">
      <div id="dbf" class="demo-bar-fill" style="width:6%;background:#3b82f6;"></div>
      <div class="demo-bar-empty"></div>
    </div>
  </div>

  <div class="demo-phases">
    <button id="pf" class="demo-phase-btn active" onclick="pick('foundational')">
      <span class="demo-pb-icon">🌱 基础适应</span>
      <span id="sf" class="demo-pb-status active-s">◉ 进行中</span>
    </button>
    <button id="ph" class="demo-phase-btn" onclick="pick('hypertrophy')">
      <span class="demo-pb-icon" style="color:#999;">🔥 燃脂强化</span>
      <span class="demo-pb-status waiting">即将到来</span>
    </button>
    <button id="pm" class="demo-phase-btn" onclick="pick('metabolic')">
      <span class="demo-pb-icon" style="color:#999;">⚡ 代谢提升</span>
      <span class="demo-pb-status waiting">即将到来</span>
    </button>
    <button id="pd" class="demo-phase-btn" onclick="pick('deload')">
      <span class="demo-pb-icon" style="color:#999;">🔄 减载恢复</span>
      <span class="demo-pb-status waiting">即将到来</span>
    </button>
  </div>

  <div class="demo-cards">
    <div class="demo-sub-card">
      <div class="demo-sub-label">✅ 本周训练</div>
      <div class="demo-sub-value">2/3</div>
      <div class="demo-sub-hint">还剩 1 天</div>
    </div>
    <div class="demo-sub-card">
      <div class="demo-sub-label">🧭 下一阶段</div>
      <div class="demo-sub-value" style="font-size:14px;">🔥 燃脂强化期</div>
      <div class="demo-sub-hint" style="color:#888;">约 4 周后</div>
    </div>
  </div>

  <div id="descBox" class="demo-desc">
    <div id="dt" class="demo-desc-title">📖 基础适应期：建立训练基础</div>
    <div id="dc2" class="demo-desc-text">以学习动作模式为主，使用轻-中等重量（60-70% 1RM）。神经系统适应优先于肌肉增长。新手在此阶段可出现「新手红利」——在热量赤字下同时增肌减脂。</div>
  </div>

</div>

<div class="legend">
  <span>🌱 点击阶段切换说明</span>
  <span>📖 科学依据内嵌</span>
  <span>✨ 每项只出现一次</span>
</div>

<script>
const DATA = {
  foundational: {
    icon: '🌱', name: '基础适应期', countdown: '4 周', week: '1/16',
    barColor: '#3b82f6', barWidth: '6%',
    descTitle: '📖 基础适应期：建立训练基础',
    desc: '以学习动作模式为主，使用轻-中等重量（60-70% 1RM）。神经系统适应优先于肌肉增长。新手在此阶段可出现「新手红利」——在热量赤字下同时增肌减脂。',
    status: '<span class="demo-pb-status active-s">◉ 进行中</span>',
    nextName: '🔥 燃脂强化期', nextTime: '约 4 周后',
    checkHint: '还剩 1 天'
  },
  hypertrophy: {
    icon: '🔥', name: '燃脂强化期', countdown: '3 周', week: '5/16',
    barColor: '#22c55e', barWidth: '31%',
    descTitle: '📖 燃脂强化期：最大化能量消耗',
    desc: '中高容量训练（8-12次，3-4组），配合 HIIT 和中等热量赤字（15-20%）。保持足够机械张力信号以防止肌肉流失，蛋白质摄入 1.6-2.4g/kg/天是减脂期保留肌肉的关键。',
    status: '<span class="demo-pb-status active-s">◉ 进行中</span>',
    nextName: '⚡ 代谢提升期', nextTime: '约 3 周后',
    checkHint: '还剩 1 天'
  },
  metabolic: {
    icon: '⚡', name: '代谢提升期', countdown: '2 周', week: '9/16',
    barColor: '#f97316', barWidth: '56%',
    descTitle: '📖 代谢提升期：突破平台期',
    desc: '混合次数范围训练（6-8次 + 15-20次交替），HIIT 频率增加。当身体适应赤字后代谢率可能下降，通过训练变化和 refeed 策略突破平台期，维持减脂势头。',
    status: '<span class="demo-pb-status active-s">◉ 进行中</span>',
    nextName: '🔄 减载恢复周', nextTime: '约 2 周后',
    checkHint: '还剩 1 天'
  },
  deload: {
    icon: '🔄', name: '减载恢复周', countdown: '1 周', week: '13/16',
    barColor: '#a855f7', barWidth: '81%',
    descTitle: '📖 减载恢复周：主动恢复',
    desc: '容量减少 50-60%，强度降至 50-60% 1RM。持续减脂给 CNS 带来巨大疲劳，减载周让神经系统和关节完全恢复。研究显示每 4-8 周安排减载可提升后续表现 32%。',
    status: '<span class="demo-pb-status active-s">◉ 进行中</span>',
    nextName: '🎉 大周期完成', nextTime: '即将完成',
    checkHint: '还剩 1 天'
  }
}

let current = 'foundational'

function pick(phase) {
  if (current === phase) return
  current = phase
  const d = DATA[phase]

  document.getElementById('di').textContent = d.icon
  document.getElementById('dn').textContent = d.name
  document.getElementById('dc').textContent = d.countdown
  document.getElementById('dwp').textContent = d.week
  document.getElementById('dbf').style.width = d.barWidth
  document.getElementById('dbf').style.background = d.barColor
  document.getElementById('dt').textContent = d.descTitle
  document.getElementById('dc2').textContent = d.desc

  // 更新下一阶段卡片
  const cards = document.querySelectorAll('.demo-sub-value')
  cards[0].textContent = '2/3'
  cards[1].textContent = d.nextName
  document.querySelectorAll('.demo-sub-hint')[0].textContent = d.checkHint
  document.querySelectorAll('.demo-sub-hint')[1].textContent = d.nextTime

  // 更新按钮状态
  const btns = ['pf','ph','pm','pd']
  btns.forEach(id => {
    const btn = document.getElementById(id)
    btn.classList.remove('active')
    btn.querySelector('.demo-pb-icon').style.color = '#999'
  })
  document.getElementById('pf').querySelector('.demo-pb-icon').style.color = '#333'

  const activeBtn = document.getElementById('pf')
  activeBtn.classList.add('active')
  activeBtn.querySelector('.demo-pb-icon').style.color = '#333'

  // 重建所有按钮的状态文字
  const phases = ['foundational','hypertrophy','metabolic','deload']
  phases.forEach((p, i) => {
    const btn = document.getElementById(btns[i])
    const statusEl = btn.querySelector('.demo-pb-status')
    if (p === phase) {
      statusEl.outerHTML = '<span class="demo-pb-status active-s">◉ 进行中</span>'
    } else if (p === 'foundational' && phase !== 'foundational') {
      statusEl.outerHTML = '<span class="demo-pb-status done">✅ 已完成</span>'
    } else {
      statusEl.outerHTML = '<span class="demo-pb-status waiting">即将到来</span>'
    }
  })
}
</script>
