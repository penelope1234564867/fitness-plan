# Render Blueprint — 将此文件连同 backend/ 一起上传到 Render
services:
  - type: web
    name: fitness-plan-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_MODEL_ID
        value: deepseek-v4-flash
      - key: FAST_LLM_MODEL_ID
        value: deepseek-v4-flash
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_TIMEOUT
        value: "60"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_API_KEY
        sync: false
